<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HaxPaintball</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: #07080c;
      font-family: sans-serif;
      color: #f2f2f2;
      height: 100%;
    }
    #view {
      display: block;
      width: 100%;
      height: 100%;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 22%, rgba(226, 61, 61, 0.55), transparent 34%),
        radial-gradient(circle at 82% 18%, rgba(61, 125, 226, 0.5), transparent 32%),
        radial-gradient(circle at 72% 78%, rgba(226, 61, 61, 0.28), transparent 28%),
        radial-gradient(circle at 24% 80%, rgba(61, 125, 226, 0.32), transparent 30%),
        radial-gradient(circle at 50% 50%, #1a2030 0%, #07080c 72%);
    }
    #splash::before,
    #splash::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.85;
    }
    #splash::before {
      width: 280px;
      height: 180px;
      left: -40px;
      bottom: 8%;
      background: radial-gradient(circle, rgba(226, 61, 61, 0.7), transparent 68%);
      transform: rotate(-18deg);
    }
    #splash::after {
      width: 320px;
      height: 200px;
      right: -60px;
      top: 10%;
      background: radial-gradient(circle, rgba(61, 125, 226, 0.65), transparent 70%);
      transform: rotate(16deg);
    }
    #splash .brand {
      position: relative;
      margin: clamp(28px, 7vh, 72px) 16px 0;
      font-size: clamp(48px, 9vw, 128px);
      font-weight: 900;
      letter-spacing: -0.045em;
      line-height: 0.9;
      text-align: center;
      color: #f7f4ee;
      text-shadow:
        0 0 18px rgba(255, 255, 255, 0.18),
        6px 8px 0 rgba(226, 61, 61, 0.55),
        -7px 5px 0 rgba(61, 125, 226, 0.5);
      animation: brand-float 5.5s ease-in-out infinite;
      will-change: transform;
    }
    #splash .brand span {
      color: #ffd36a;
      display: inline-block;
      animation: paint-glow 2.8s ease-in-out infinite;
    }
    @keyframes brand-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes paint-glow {
      0%, 100% { opacity: 0.82; }
      50% { opacity: 1; }
    }
    #splash .deco {
      position: absolute;
      inset: 0;
    }
    #splash .splat {
      position: absolute;
      width: 120px;
      height: 96px;
      background:
        radial-gradient(circle at 22% 28%, var(--ink) 0 5px, transparent 6px),
        radial-gradient(circle at 78% 24%, var(--ink) 0 4px, transparent 5px),
        radial-gradient(circle at 84% 68%, var(--ink) 0 7px, transparent 8px),
        radial-gradient(circle at 18% 74%, var(--ink) 0 6px, transparent 7px),
        radial-gradient(circle at 48% 46%, var(--core) 0 34%, var(--edge) 62%, transparent 64%);
      filter: none;
    }
    #splash .splat::before,
    #splash .splat::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: var(--core);
    }
    #splash .splat::before {
      width: 22px;
      height: 16px;
      left: -8px;
      top: 18px;
      transform: rotate(-24deg);
    }
    #splash .splat::after {
      width: 16px;
      height: 12px;
      right: -4px;
      bottom: 16px;
      transform: rotate(18deg);
    }
    #splash .splat.red {
      --core: #e23d3d;
      --edge: #9d1d1d;
      --ink: #ffb0a0;
      left: 6%;
      top: 16%;
      transform: rotate(-14deg);
      animation: splat-wobble 7s ease-in-out infinite;
    }
    #splash .splat.blue {
      --core: #3d7de2;
      --edge: #1d4f9d;
      --ink: #c5dcff;
      width: 104px;
      height: 84px;
      right: 8%;
      top: 24%;
      transform: rotate(16deg);
      animation: splat-wobble 8.5s ease-in-out infinite reverse;
    }
    #splash .splat.gold {
      --core: #e2a83d;
      --edge: #a56b12;
      --ink: #ffe7a3;
      width: 64px;
      height: 52px;
      left: 14%;
      bottom: 14%;
      transform: rotate(8deg);
    }
    #splash .marker {
      position: absolute;
      right: 7%;
      bottom: 12%;
      width: 210px;
      height: 72px;
      transform: rotate(-24deg);
      animation: marker-drift 6.5s ease-in-out infinite;
    }
    #splash .marker .barrel,
    #splash .marker .body,
    #splash .marker .grip,
    #splash .marker .hopper,
    #splash .marker .feed {
      position: absolute;
    }
    #splash .marker .barrel {
      left: 0;
      top: 28px;
      width: 92px;
      height: 16px;
      border-radius: 8px;
      background: linear-gradient(#f7fafc, #8e98a6 55%, #d5dbe3);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25);
    }
    #splash .marker .barrel::after {
      content: "";
      position: absolute;
      left: -6px;
      top: 3px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1a1e24;
      box-shadow: inset 0 0 0 2px #c9d0d8;
    }
    #splash .marker .body {
      left: 78px;
      top: 20px;
      width: 96px;
      height: 32px;
      border-radius: 8px 18px 12px 6px;
      background: linear-gradient(180deg, #6aa2f0, #2457b8 58%, #163a7a);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.35),
        inset 0 -8px 0 rgba(0, 0, 0, 0.18);
    }
    #splash .marker .feed {
      left: 108px;
      top: 8px;
      width: 18px;
      height: 16px;
      background: #1e2430;
      border-radius: 4px 4px 0 0;
    }
    #splash .marker .hopper {
      left: 96px;
      top: -8px;
      width: 40px;
      height: 22px;
      border-radius: 16px 16px 6px 6px;
      background:
        radial-gradient(circle at 30% 60%, #e23d3d 0 3px, transparent 4px),
        radial-gradient(circle at 55% 55%, #3d7de2 0 3px, transparent 4px),
        radial-gradient(circle at 72% 62%, #ffd36a 0 3px, transparent 4px),
        linear-gradient(#f4f7fb, #c5ced8);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.45);
    }
    #splash .marker .grip {
      left: 132px;
      top: 48px;
      width: 18px;
      height: 26px;
      border-radius: 0 0 7px 7px;
      background: repeating-linear-gradient(#1a1e24 0 3px, #2a313c 3px 5px);
      transform: skewX(-14deg);
    }
    #splash .ball {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 30%, rgba(255, 255, 255, 0.95) 0 2px, transparent 3px),
        radial-gradient(circle at 38% 36%, var(--hi), var(--lo));
      box-shadow: inset -3px -3px 0 rgba(0, 0, 0, 0.18);
      animation: ball-bob 4.2s ease-in-out infinite;
    }
    #splash .ball.b1 {
      --hi: #ffe7a3;
      --lo: #c9841a;
      left: 11%;
      bottom: 22%;
    }
    #splash .ball.b2 {
      --hi: #b9d4ff;
      --lo: #2457b8;
      width: 14px;
      height: 14px;
      left: 22%;
      top: 62%;
      animation-delay: -1.4s;
    }
    #splash .ball.b3 {
      --hi: #ffb0a0;
      --lo: #c42323;
      width: 16px;
      height: 16px;
      right: 24%;
      top: 14%;
      animation-delay: -2.6s;
    }
    @keyframes splat-wobble {
      0%, 100% { transform: rotate(-16deg) scale(1); }
      50% { transform: rotate(-10deg) scale(1.04); }
    }
    @keyframes marker-drift {
      0%, 100% { transform: rotate(-28deg) translateY(0); }
      50% { transform: rotate(-24deg) translateY(-8px); }
    }
    @keyframes ball-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .brand,
      #splash .brand span,
      #splash .splat,
      #splash .marker,
      #splash .ball {
        animation: none;
      }
    }
    @media (max-width: 720px) {
      #splash .marker,
      #splash .splat.gold,
      #splash .ball.b1 {
        display: none;
      }
    }
    #splash.hidden {
      display: none;
    }
    #lobby {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    #lobby.hidden {
      display: none;
    }
    #lobby .card {
      pointer-events: auto;
      width: min(560px, calc(100vw - 32px));
      padding: 20px;
      border-radius: 12px;
      background: rgba(16, 18, 20, 0.88);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #lobby h1 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 600;
    }
    #lobby label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
    }
    #lobby input, #lobby select, #lobby button {
      font: inherit;
      color: #f2f2f2;
      background: #1c2228;
      border: 1px solid #3a4450;
      border-radius: 6px;
      padding: 8px 10px;
    }
    #lobby button {
      cursor: pointer;
      background: #2a3644;
    }
    #lobby button:hover {
      background: #354556;
    }
    #lobby .row {
      display: flex;
      gap: 8px;
    }
    #lobby .row input {
      flex: 1;
      min-width: 0;
    }
    #map-pick:disabled {
      opacity: 0.7;
      cursor: default;
    }
    #status {
      min-height: 1.2em;
      font-size: 13px;
      color: #c9d2dc;
    }
    #room-bar {
      display: none;
      align-items: center;
      gap: 8px;
    }
    #room-bar.visible {
      display: flex;
    }
    #room-code {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      font-weight: 600;
    }
    #teams {
      display: none;
      gap: 8px;
    }
    #teams.visible {
      display: flex;
    }
    #teams .col {
      flex: 1;
      min-width: 0;
      padding: 8px;
      border-radius: 8px;
      background: #1c2228;
    }
    #teams .col.red {
      box-shadow: inset 0 0 0 1px rgba(226, 61, 61, 0.55);
    }
    #teams .col.blue {
      box-shadow: inset 0 0 0 1px rgba(61, 125, 226, 0.55);
    }
    #teams h2 {
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }
    #teams ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    #teams li {
      font-size: 13px;
      padding: 4px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.04);
    }
    #teams li.self {
      outline: 1px solid #f2f2f2;
    }
    #teams .col {
      cursor: pointer;
    }
    #teams .col:hover {
      background: #24303a;
    }
    #teams .col.picked {
      outline: 1px solid #f2f2f2;
    }
    #shuffle, #play {
      display: none;
    }
    #shuffle.visible, #play.visible {
      display: block;
    }
    #lobby #server-host {
      flex-direction: row;
      align-items: center;
      gap: 8px;
      color: #c9d2dc;
    }
    #lobby #server-host input {
      width: auto;
      flex: 0 0 auto;
      margin: 0;
      padding: 0;
    }
    #hotseat {
      position: fixed;
      right: 12px;
      bottom: 12px;
      font-size: 12px;
      color: #c9d2dc;
      pointer-events: none;
    }
    #hotseat.hidden {
      display: none;
    }
    #corner {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 3;
      display: flex;
      gap: 8px;
    }
    #corner button {
      font: inherit;
      color: #f2f2f2;
      background: rgba(16, 18, 20, 0.82);
      border: 1px solid #3a4450;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
    }
    #corner button:hover,
    #corner button.on {
      background: #2a3644;
    }
    #corner button.hidden {
      display: none;
    }
    #team-board,
    #scoreboard {
      position: fixed;
      z-index: 3;
      color: #f2f2f2;
      background: rgba(16, 18, 20, 0.82);
      border: 1px solid #3a4450;
      border-radius: 8px;
      padding: 8px 10px;
    }
    #team-board {
      right: 16px;
      bottom: 16px;
      pointer-events: none;
      background: rgba(16, 18, 20, 0.34);
      border-color: rgba(58, 68, 80, 0.35);
    }
    #scoreboard {
      top: 52px;
      right: 12px;
      display: flex;
      gap: 16px;
    }
    #scoreboard h2 {
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }
    #scoreboard .side.red h2 {
      color: #e23d3d;
    }
    #scoreboard .side.blue h2 {
      color: #3d7de2;
    }
    #team-board.hidden,
    #scoreboard.hidden {
      display: none;
    }
    #team-board table,
    #scoreboard table {
      border-collapse: collapse;
      font-size: 13px;
    }
    #team-board th,
    #scoreboard th,
    #team-board td,
    #scoreboard td {
      padding: 3px 8px;
      text-align: left;
      font-weight: 500;
      white-space: nowrap;
    }
    #team-board th,
    #scoreboard th {
      color: #9aa6b2;
      font-size: 11px;
      font-weight: 600;
    }
    #team-board td:not(:first-child),
    #scoreboard td:not(:first-child) {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    #team-board tr.red td,
    #scoreboard .side.red td:first-child {
      color: #e23d3d;
    }
    #team-board tr.blue td,
    #scoreboard .side.blue td:first-child {
      color: #3d7de2;
    }
    #team-board tr.self td:first-child,
    #scoreboard tr.self td:first-child {
      font-weight: 700;
    }
    #team-board tr.dead td {
      color: #9aa3ad;
    }
    #lang-pick {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #f2f2f2;
    }
    #lang-pick.hidden {
      display: none;
    }
    #lang-pick select {
      font: inherit;
      color: #f2f2f2;
      background: rgba(16, 18, 20, 0.88);
      border: 1px solid #3a4450;
      border-radius: 6px;
      padding: 8px 10px;
    }
    #rules-row label {
      flex: 1;
      min-width: 0;
    }
    #rules-row input {
      width: 90%;
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="corner">
    <button type="button" id="score-btn" class="hidden" data-i18n="scoreboard">Wyniki</button>
    <button type="button" id="menu" class="hidden" data-i18n="menu">Lobby</button>
  </div>
  <div id="team-board" class="hidden" hidden>
    <table>
      <thead>
        <tr>
          <th data-i18n="nick">Nick</th>
          <th data-i18n="kills">K</th>
          <th data-i18n="deaths">D</th>
          <th data-i18n="kd">K/D</th>
        </tr>
      </thead>
      <tbody id="team-board-body"></tbody>
    </table>
  </div>
  <div id="scoreboard" class="hidden" hidden>
    <section class="side red">
      <h2 data-i18n="hudRed">czerwoni</h2>
      <table>
        <thead>
          <tr>
            <th data-i18n="nick">Nick</th>
            <th data-i18n="kills">K</th>
            <th data-i18n="deaths">D</th>
            <th data-i18n="kd">K/D</th>
          </tr>
        </thead>
        <tbody id="score-red"></tbody>
      </table>
    </section>
    <section class="side blue">
      <h2 data-i18n="hudBlue">niebiescy</h2>
      <table>
        <thead>
          <tr>
            <th data-i18n="nick">Nick</th>
            <th data-i18n="kills">K</th>
            <th data-i18n="deaths">D</th>
            <th data-i18n="kd">K/D</th>
          </tr>
        </thead>
        <tbody id="score-blue"></tbody>
      </table>
    </section>
  </div>
  <label id="lang-pick">
    <span data-i18n="lang">Język</span>
    <select id="lang">
      <option value="pl">Polski</option>
      <option value="en">English</option>
    </select>
  </label>
  <div id="splash" aria-hidden="true">
    <div class="deco">
      <span class="splat red"></span>
      <span class="splat blue"></span>
      <span class="splat gold"></span>
      <span class="ball b1"></span>
      <span class="ball b2"></span>
      <span class="ball b3"></span>
      <span class="marker">
        <span class="barrel"></span>
        <span class="body"></span>
        <span class="feed"></span>
        <span class="grip"></span>
        <span class="hopper"></span>
      </span>
    </div>
    <p class="brand">hax<span>PAINT</span>ball</p>
  </div>
  <div id="lobby">
    <form class="card" id="lobby-form" action="#">
      <h1>HaxPaintball</h1>
      <label id="nick-label">
        Nick
        <input id="nick" name="nick" type="text" maxlength="16" autocomplete="nickname">
      </label>
      <label id="map-label">
        Mapa
        <select id="map-pick"></select>
      </label>
      <div class="row" id="rules-row">
        <label id="round-time-label">
          Czas gry (min)
          <input id="round-time" name="round-time" type="number" min="1" max="10" step="1" value="3">
        </label>
        <label id="wins-needed-label">
          Punkty do wygranej
          <input id="wins-needed" name="wins-needed" type="number" min="1" max="20" step="1" value="5">
        </label>
      </div>
      <div id="room-bar">
        <span id="room-code"></span>
        <button type="button" id="copy-code" data-i18n="copy">Kopiuj</button>
        <button type="button" id="leave" data-i18n="leave">Wyjdź</button>
      </div>
      <div id="teams">
        <section class="col red" id="pick-red" data-team="red">
          <h2>Red</h2>
          <ul id="list-red"></ul>
        </section>
        <section class="col spec" id="pick-spec" data-team="spec">
          <h2>Spec</h2>
          <ul id="list-spec"></ul>
        </section>
        <section class="col blue" id="pick-blue" data-team="blue">
          <h2>Blue</h2>
          <ul id="list-blue"></ul>
        </section>
      </div>
      <button type="button" id="shuffle" data-i18n="shuffle">Rozlosuj</button>
      <button type="button" id="play" data-i18n="play">Graj</button>
      <label id="server-host">
        <input id="server-host-check" type="checkbox">
        <span data-i18n="serverHost">Host na serwerze</span>
      </label>
      <button type="button" id="create" data-i18n="create">Utwórz pokój</button>
      <div class="row" id="join-row">
        <input id="code" name="code" type="text" maxlength="8" placeholder="kod" autocomplete="off" data-i18n-placeholder="codePlaceholder">
        <button type="button" id="join" data-i18n="join">Dołącz</button>
      </div>
      <div id="status"></div>
    </form>
  </div>
  <div id="hotseat" data-i18n="hotseat">lokalnie: WASD/strzałki + X/Spacja, przeładowanie Z · drugi gracz IJKL + U, przeładowanie O · zoom: Page Up/Down, +/- lub kółko</div>
  <script type="module" src="/client/game.js"></script>
</body>
</html>
